# Webull Residual Liquidity Exhaustion Bot — example configuration.
# Copy to config/settings.yaml. Secrets come ONLY from environment variables:
#   WEBULL_APP_KEY, WEBULL_APP_SECRET, WEBULL_ACCOUNT_ID
# Live trading requires mode: live AND live_trading_enabled: true AND
# environment: production. All three default to safe values.

environment: sandbox
mode: record                 # record | research | replay | paper | live
live_trading_enabled: false  # double opt-in interlock; leave false

symbols: [MU, WDC, SNDK, NVDA, KLAC]
market_etf: QQQ
sector_etf: SMH

benchmarks:                  # symbol -> correlated peers (equal-weight factor)
  MU:   [WDC, SNDK, AMD, AVGO]
  WDC:  [MU, SNDK, MRVL]
  SNDK: [WDC, MU, MRVL]
  NVDA: [AMD, AVGO, MRVL]
  KLAC: [AMAT, LRCX, SOXX]

stream_types: [QUOTE, TICK]
subscribe_depth: false       # enable if your Webull data entitlement includes L2
subscribe_noii: false        # optional auction imbalance; strategy does not depend on it

record_root: data
feature_window_seconds: 120
residual_halflife_seconds: 300
signal_interval_ms: 1000
session_open: "09:30"
session_close: "16:00"
session_tz: America/New_York

risk:
  risk_per_trade_usd: 20.0
  max_position_shares: 500
  max_notional_per_symbol_usd: 2000.0
  max_gross_exposure_usd: 5000.0
  max_positions: 2
  max_daily_loss_usd: 100.0
  max_consecutive_losses: 3
  max_spread_bps: 8.0
  max_slippage_bps: 6.0
  max_holding_seconds: 600
  stale_data_ms: 1500
  max_order_retries: 2
  symbol_cooldown_seconds: 120
  strategy_cooldown_seconds: 300
  kill_switch: false

strategy:
  residual_z_entry: 2.25
  min_score: 3.0
  min_continuation_score: 3.5
  max_holding_seconds: 300
  target_residual_reversion: 0.55
  stop_bps: 22.0
  min_events: 25
  no_trade_first_seconds: 120
  no_trade_last_seconds: 300
  min_volume_z: 1.0
  max_peer_confirmation_for_reversal: 0.30
  min_peer_confirmation_for_continuation: 0.50
  weights:                    # scoring coefficients — calibrate via `wliq research`
    residual_z: 1.20
    flow_exhaustion: 0.80
    impact_decay: 0.75
    replenishment: 0.55
    microprice: 0.35
    peer_divergence: 0.65
    volume_surprise: 0.30
    depth_imbalance: 0.40
    spread_normalization: 0.25

governor:
  max_breadth_for_reversal: 0.75
  max_realized_vol_bps: 90.0
  min_realized_vol_bps: 2.0
  max_spread_pctile_for_entry: 0.90
  max_sequence_gap_tolerance: 5
  require_healthy_stream: true
  catalyst_blacklist: []      # symbols with verified stock-specific news today
  earnings_blacklist: []      # symbols reporting today / tonight

execution:
  passive_offset_ticks: 0
  tick_size: 0.01
  cancel_after_ms: 1200
  paper:
    latency_ms: 250
    cancel_latency_ms: 200
    queue_position_factor: 1.0
    require_trade_through: true
    marketable_max_take_fraction: 0.50
    adverse_selection_bps: 1.0
    partial_fill_min_shares: 10

recorder:
  flush_rows: 1000
  flush_seconds: 30
  dedupe: true

volume_model:
  profile_path: data/profiles/volume_profile.parquet
  bucket_minutes: 5
  min_history_days: 5

logging:
  level: INFO
  json_file: logs/wliq.jsonl

# ---- v2.0 additions ----
reconcile_interval_s: 45        # periodic live REST reconciliation (30-60s)
min_data_confidence: 0.7        # Sprint-1 quality gate; fail-closed below this
sector_map:                     # portfolio sector limits (Sprint 5)
  MU: semis
  WDC: semis
  SNDK: semis
  NVDA: semis
  KLAC: semis
